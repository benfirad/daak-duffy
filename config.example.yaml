# Duffy Configuration Example
# Copy to config.yaml and adjust to your environment

duffy:
  host: "0.0.0.0"
  port: 8899
  poll_interval: 10
  auto_approve_level: 0  # 0: safe tasks auto-approved, 1+: requires human approval

database:
  path: "~/.duffy/duffy.db"

models:
  # Multi-model quota-fallback priority
  fallback_pool:
    - "gemini-2.5-flash"
    - "gemini-2.5-pro"
    - "claude-3-7-sonnet"
    - "ollama:llama3"

integrations:
  whatsapp:
    enabled: false
    webhook_url: "http://localhost:3001/send"
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
